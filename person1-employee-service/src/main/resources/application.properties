spring.application.name=person1-employee-service
server.port=${EMPLOYEE_SERVICE_PORT:8080}
spring.datasource.url=${EMPLOYEE_DATABASE_URL:jdbc:h2:file:./data/hrmsdb;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${EMPLOYEE_DATABASE_USERNAME:sa}
spring.datasource.password=${EMPLOYEE_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${ENABLE_H2_CONSOLE:false}
spring.h2.console.path=/h2-console
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.jwt.secret-base64=${HRMS_JWT_SECRET_BASE64:}
app.jwt.issuer=${HRMS_JWT_ISSUER:hrms-employee-service}
app.jwt.audience=${HRMS_JWT_AUDIENCE:hrms-leave-service}
app.jwt.recruitment-audience=${HRMS_RECRUITMENT_JWT_AUDIENCE:hrms-recruitment-service}
app.leave-directory-token=${EMPLOYEE_SERVICE_INTERNAL_TOKEN:}
app.bootstrap.enabled=${HRMS_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.email=${HRMS_ADMIN_EMAIL:}
app.bootstrap.password=${HRMS_ADMIN_PASSWORD:}
