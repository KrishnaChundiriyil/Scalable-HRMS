spring.application.name=person1-employee-service
server.port=${EMPLOYEE_SERVICE_PORT:8080}
spring.data.mongodb.uri=${EMPLOYEE_MONGODB_URI:mongodb://localhost:27017/hrms_employee}
spring.data.mongodb.auto-index-creation=true
app.legacy-import.enabled=${EMPLOYEE_IMPORT_LEGACY_H2:false}
app.legacy-import.url=${EMPLOYEE_LEGACY_JDBC_URL:jdbc:h2:file:./data/hrmsdb;AUTO_SERVER=TRUE}
app.legacy-import.username=${EMPLOYEE_DATABASE_USERNAME:sa}
app.legacy-import.password=${EMPLOYEE_DATABASE_PASSWORD:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.jwt.secret-base64=${HRMS_JWT_SECRET_BASE64:}
app.jwt.issuer=${HRMS_JWT_ISSUER:hrms-employee-service}
app.jwt.audience=${HRMS_JWT_AUDIENCE:hrms-leave-service}
app.jwt.recruitment-audience=${HRMS_RECRUITMENT_JWT_AUDIENCE:hrms-recruitment-service}
app.jwt.payroll-audience=${HRMS_PAYROLL_JWT_AUDIENCE:hrms-payroll-service}
app.leave-directory-token=${EMPLOYEE_SERVICE_INTERNAL_TOKEN:}
app.bootstrap.enabled=${HRMS_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.email=${HRMS_ADMIN_EMAIL:}
app.bootstrap.password=${HRMS_ADMIN_PASSWORD:}
