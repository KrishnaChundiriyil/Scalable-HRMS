spring.application.name=payroll-service
server.port=${PAYROLL_SERVICE_PORT:8083}
spring.data.mongodb.uri=${PAYROLL_MONGODB_URI:mongodb://localhost:27017/hrms_payroll}
spring.data.mongodb.auto-index-creation=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
hrms.security.jwt-secret-base64=${HRMS_JWT_SECRET_BASE64:}
hrms.security.jwk-set-uri=${HRMS_JWT_JWK_SET_URI:}
hrms.security.issuer=${HRMS_JWT_ISSUER:hrms-employee-service}
hrms.security.audience=${HRMS_PAYROLL_JWT_AUDIENCE:hrms-payroll-service}
hrms.employee-service.url=${EMPLOYEE_SERVICE_URL:http://localhost:8080}
hrms.employee-service.directory-path=${EMPLOYEE_DIRECTORY_PATH:/api/internal/employees}
hrms.employee-service.connect-timeout-ms=${EMPLOYEE_CONNECT_TIMEOUT_MS:1000}
hrms.employee-service.read-timeout-ms=${EMPLOYEE_READ_TIMEOUT_MS:2000}
hrms.leave-service.url=${LEAVE_SERVICE_URL:http://localhost:8081}
