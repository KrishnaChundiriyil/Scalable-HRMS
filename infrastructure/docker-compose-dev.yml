services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - hrms_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 6s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - hrms_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  leave-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/leave-service/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/hrms_leave
      SPRING_DATA_REDIS_HOST: redis
      HRMS_JWT_SECRET_BASE64: ${HRMS_JWT_SECRET_BASE64:-}
      HRMS_JWT_ISSUER: ${HRMS_JWT_ISSUER:-hrms-employee-service}
      HRMS_JWT_AUDIENCE: ${HRMS_JWT_AUDIENCE:-hrms-leave-service}
      HRMS_JWT_JWK_SET_URI: ${HRMS_JWT_JWK_SET_URI:-}
      EMPLOYEE_SERVICE_URL: ${DOCKER_EMPLOYEE_SERVICE_URL:-http://host.docker.internal:8080}
      EMPLOYEE_DIRECTORY_PATH: ${EMPLOYEE_DIRECTORY_PATH:-/api/internal/employees}
      LEAVE_HOLIDAYS: ${LEAVE_HOLIDAYS:-}
      EMPLOYEE_SERVICE_INTERNAL_TOKEN: ${EMPLOYEE_SERVICE_INTERNAL_TOKEN:-}
      LEAVE_REMINDERS_ENABLED: ${LEAVE_REMINDERS_ENABLED:-true}
  kafka:
    profiles: ["recruitment"]
    image: apache/kafka:3.8.0
    ports:
      - "127.0.0.1:9092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - hrms_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 8s
      retries: 12
  recruitment-service:
    profiles: ["recruitment"]
    build:
      context: ..
      dockerfile: backend/recruitment-service/Dockerfile
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RECRUITMENT_MONGODB_URI: mongodb://mongodb:27017/hrms_recruitment
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HRMS_JWT_SECRET_BASE64: ${HRMS_JWT_SECRET_BASE64:-}
      HRMS_JWT_ISSUER: ${HRMS_JWT_ISSUER:-hrms-employee-service}
      HRMS_RECRUITMENT_JWT_AUDIENCE: ${HRMS_RECRUITMENT_JWT_AUDIENCE:-hrms-recruitment-service}
      HRMS_JWT_JWK_SET_URI: ${HRMS_JWT_JWK_SET_URI:-}
      EMPLOYEE_SERVICE_URL: ${DOCKER_EMPLOYEE_SERVICE_URL:-http://host.docker.internal:8080}
      RECRUITMENT_BASE_URL: ${RECRUITMENT_BASE_URL:-http://localhost:8084}
      RECRUITMENT_STORAGE_ROOT: /app/resume-storage
      RECRUITMENT_KAFKA_TOPIC: ${RECRUITMENT_KAFKA_TOPIC:-hrms.application.events}
      RECRUITMENT_KAFKA_GROUP: ${RECRUITMENT_KAFKA_GROUP:-hrms-notification-group}
    volumes:
      - hrms_resumes:/app/resume-storage
  payroll-service:
    profiles: ["payroll"]
    build:
      context: ../backend/payroll-service
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      mongodb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PAYROLL_MONGODB_URI: mongodb://mongodb:27017/hrms_payroll
      HRMS_JWT_SECRET_BASE64: ${HRMS_JWT_SECRET_BASE64:-}
      HRMS_JWT_ISSUER: ${HRMS_JWT_ISSUER:-hrms-employee-service}
      HRMS_PAYROLL_JWT_AUDIENCE: ${HRMS_PAYROLL_JWT_AUDIENCE:-hrms-payroll-service}
      HRMS_JWT_JWK_SET_URI: ${HRMS_JWT_JWK_SET_URI:-}
      EMPLOYEE_SERVICE_URL: ${DOCKER_EMPLOYEE_SERVICE_URL:-http://host.docker.internal:8080}
      LEAVE_SERVICE_URL: ${DOCKER_LEAVE_SERVICE_URL:-http://host.docker.internal:8081}
volumes:
  hrms_mongodb:
  hrms_redis:
  hrms_kafka:
  hrms_resumes:
