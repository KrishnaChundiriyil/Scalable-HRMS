x-payroll: &payroll
  image: scalable-hrms-payroll:local
  build: ../backend/payroll-service
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    PAYROLL_SERVICE_PORT: 8081
    PAYROLL_MONGODB_URI: mongodb://payroll-mongodb:27017/hrms_payroll
    HRMS_JWT_SECRET_BASE64: ${HRMS_JWT_SECRET_BASE64:-}
    HRMS_JWT_ISSUER: ${HRMS_JWT_ISSUER:-hrms-employee-service}
    HRMS_PAYROLL_JWT_AUDIENCE: ${HRMS_PAYROLL_JWT_AUDIENCE:-hrms-payroll-service}
    HRMS_JWT_JWK_SET_URI: ${HRMS_JWT_JWK_SET_URI:-}
    EMPLOYEE_SERVICE_URL: ${DOCKER_EMPLOYEE_SERVICE_URL:-http://host.docker.internal:8080}
    LEAVE_SERVICE_URL: ${DOCKER_LEAVE_SERVICE_URL:-http://host.docker.internal:8081}
  depends_on:
    payroll-mongodb:
      condition: service_healthy

services:
  payroll-mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - payroll_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 6s
      retries: 10

  payroll1:
    <<: *payroll

  payroll2:
    <<: *payroll

  payroll3:
    <<: *payroll

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx-payroll.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - payroll1
      - payroll2
      - payroll3

volumes:
  payroll_mongodb_data:
