spring.application.name=hrms-leave-service
server.port=${LEAVE_SERVICE_PORT:8081}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hrms_leave?serverSelectionTimeoutMS=2000&connectTimeoutMS=1000&socketTimeoutMS=3000}
spring.data.mongodb.auto-index-creation=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Must be provided via environment, never committed to Git
hrms.security.jwt-secret-base64=${HRMS_JWT_SECRET_BASE64:}
hrms.security.jwk-set-uri=${HRMS_JWT_JWK_SET_URI:}
hrms.security.issuer=${HRMS_JWT_ISSUER:hrms-employee-service}
hrms.security.audience=${HRMS_JWT_AUDIENCE:hrms-leave-service}
hrms.employee-service.url=${EMPLOYEE_SERVICE_URL:http://localhost:8080}
hrms.employee-service.connect-timeout-ms=${EMPLOYEE_CONNECT_TIMEOUT_MS:1000}
hrms.employee-service.read-timeout-ms=${EMPLOYEE_READ_TIMEOUT_MS:2000}
hrms.employee-service.max-attempts=${EMPLOYEE_MAX_ATTEMPTS:2}
hrms.rate.capacity=5
hrms.rate.refill-per-second=1
management.endpoints.web.exposure.include=health,info
resilience4j.circuitbreaker.instances.employeeDirectory.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.employeeDirectory.slidingWindowSize=4
resilience4j.circuitbreaker.instances.employeeDirectory.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.employeeDirectory.failureRateThreshold=50
resilience4j.circuitbreaker.instances.employeeDirectory.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.employeeDirectory.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.employeeDirectory.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.employeeDirectory.ignoreExceptions=org.springframework.web.client.HttpClientErrorException

# Company policy defaults; HR must determine case-specific parental eligibility.
hrms.leave.timezone=Asia/Kolkata
hrms.leave.holidays=${LEAVE_HOLIDAYS:}
hrms.leave.max-requests=5000
hrms.leave.types[ANNUAL].yearly-allowance=20
hrms.leave.types[ANNUAL].max-per-request=20
hrms.leave.types[ANNUAL].paid=true
hrms.leave.types[ANNUAL].counting=WORKING_DAYS
hrms.leave.types[ANNUAL].eligibility-review-required=false
hrms.leave.types[SICK].yearly-allowance=10
hrms.leave.types[SICK].max-per-request=10
hrms.leave.types[SICK].paid=true
hrms.leave.types[SICK].counting=WORKING_DAYS
hrms.leave.types[SICK].eligibility-review-required=false
hrms.leave.types[CASUAL].yearly-allowance=12
hrms.leave.types[CASUAL].max-per-request=12
hrms.leave.types[CASUAL].paid=true
hrms.leave.types[CASUAL].counting=WORKING_DAYS
hrms.leave.types[CASUAL].eligibility-review-required=false
hrms.leave.types[BEREAVEMENT].yearly-allowance=5
hrms.leave.types[BEREAVEMENT].max-per-request=5
hrms.leave.types[BEREAVEMENT].paid=true
hrms.leave.types[BEREAVEMENT].counting=WORKING_DAYS
hrms.leave.types[BEREAVEMENT].eligibility-review-required=false
hrms.leave.types[PATERNITY].yearly-allowance=-1
hrms.leave.types[PATERNITY].max-per-request=14
hrms.leave.types[PATERNITY].paid=true
hrms.leave.types[PATERNITY].counting=WORKING_DAYS
hrms.leave.types[PATERNITY].eligibility-review-required=true
hrms.leave.types[MATERNITY].yearly-allowance=-1
hrms.leave.types[MATERNITY].max-per-request=182
hrms.leave.types[MATERNITY].paid=true
hrms.leave.types[MATERNITY].counting=CALENDAR_DAYS
hrms.leave.types[MATERNITY].eligibility-review-required=true
hrms.leave.types[UNPAID].yearly-allowance=-1
hrms.leave.types[UNPAID].max-per-request=90
hrms.leave.types[UNPAID].paid=false
hrms.leave.types[UNPAID].counting=CALENDAR_DAYS
hrms.leave.types[UNPAID].eligibility-review-required=false
hrms.notifications.outbox-delay-ms=1000
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
spring.data.redis.repositories.enabled=false

# Half days and reminders (service credential never comes from an employee token).
hrms.leave.half-day-types=ANNUAL,SICK,CASUAL
hrms.employee-service.internal-token=${EMPLOYEE_SERVICE_INTERNAL_TOKEN:}
hrms.reminders.enabled=${LEAVE_REMINDERS_ENABLED:true}
hrms.reminders.after-hours=48
hrms.reminders.repeat-hours=24
hrms.reminders.scan-delay-ms=60000
spring.task.scheduling.pool.size=3
hrms.employee-service.directory-path=${EMPLOYEE_DIRECTORY_PATH:/api/internal/employees}
