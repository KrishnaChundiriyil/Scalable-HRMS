spring.application.name=hrms-leave-service
server.port=${LEAVE_SERVICE_PORT:8081}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hrms_leave}
spring.data.mongodb.auto-index-creation=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Must be provided via environment, never committed to Git
hrms.security.jwt-secret-base64=${HRMS_JWT_SECRET_BASE64}
hrms.employee-service.url=${EMPLOYEE_SERVICE_URL:http://localhost:8082}
hrms.leave.annual-days=20
hrms.leave.sick-days=10
hrms.rate.capacity=5
hrms.rate.refill-per-second=1
management.endpoints.web.exposure.include=health,info
resilience4j.circuitbreaker.instances.employeeDirectory.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.employeeDirectory.slidingWindowSize=4
resilience4j.circuitbreaker.instances.employeeDirectory.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.employeeDirectory.failureRateThreshold=50
resilience4j.circuitbreaker.instances.employeeDirectory.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.employeeDirectory.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.employeeDirectory.automaticTransitionFromOpenToHalfOpenEnabled=true
