name: Leave backend tests
on:
  push:
    paths:
      - 'leave-service/**'
      - '.github/workflows/leave-service-test.yml'
  pull_request:
    paths:
      - 'leave-service/**'
      - '.github/workflows/leave-service-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: leave-service/pom.xml
      - name: Compile and run unit tests
        working-directory: leave-service
        run: mvn -B --no-transfer-progress clean test
