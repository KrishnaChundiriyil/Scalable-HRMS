name: HRMS backend integration tests
on:
  push:
    paths:
      - 'leave-service/**'
      - 'person1-employee-service/**'
      - 'recruitment-service/**'
      - 'payroll-service/**'
      - 'jmeter/**'
      - 'infrastructure/**'
      - 'scripts/verify_real_integration.py'
      - '.github/workflows/leave-service-test.yml'
  pull_request:
    paths:
      - 'leave-service/**'
      - 'person1-employee-service/**'
      - 'recruitment-service/**'
      - 'payroll-service/**'
      - 'jmeter/**'
      - 'infrastructure/**'
      - 'scripts/verify_real_integration.py'
      - '.github/workflows/leave-service-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate combined service configuration
        run: |
          docker compose --env-file .env.example -f infrastructure/docker-compose-dev.yml --profile recruitment --profile payroll config --quiet
          docker compose --env-file .env.example -f infrastructure/docker-compose-payroll.yml config --quiet
          docker compose -f infrastructure/docker-compose-sharded.yml config --quiet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            leave-service/pom.xml
            person1-employee-service/pom.xml
            recruitment-service/pom.xml
            payroll-service/pom.xml
      - name: Verify unit and MongoDB/Redis integration tests
        working-directory: leave-service
        run: mvn -B --no-transfer-progress clean verify
      - name: Verify final Employee module
        working-directory: person1-employee-service
        run: mvn -B --no-transfer-progress clean verify
      - name: Verify Recruitment module
        working-directory: recruitment-service
        run: mvn -B --no-transfer-progress clean verify
      - name: Verify Payroll module
        working-directory: payroll-service
        run: mvn -B --no-transfer-progress clean verify
      - name: Verify all four services with Kafka and load-balanced Payroll
        run: python3 scripts/verify_real_integration.py --with-recruitment --with-payroll
